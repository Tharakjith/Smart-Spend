# SmartSpend full stack: `cp .env.example .env` (set the secrets), then `docker compose up --build`
# and open http://localhost:8080
name: smartspend

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartspend}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartspend}
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: ${S3_BUCKET:-smartspend-documents}
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smartspend}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    # Bundled MinIO has no KMS, so encryption at rest comes from the encrypted host volume (docs/DEPLOYMENT.md).
    # With AWS S3 or a KMS-enabled MinIO, set S3_SSE=AES256.
    S3_SSE: ${S3_SSE:-}
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartspend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smartspend}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartspend}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartspend}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Creates the private, encrypted document bucket (no anonymous access).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartspend}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      BUCKET: ${S3_BUCKET:-smartspend-documents}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        mc anonymous set none "local/$$BUCKET" &&
        (mc encrypt set sse-s3 "local/$$BUCKET" || true)

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped

  # Optional malware scanning: `docker compose --profile scan up` and set MALWARE_SCANNER=clamav
  clamav:
    image: clamav/clamav:1.4
    profiles: [scan]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
